version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: servicenow-ai-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: servicenow-ai-backend
    ports:
      - "8000:8000"
    environment:
      - ENV=dev
      - AUTH_MODE=dev_bypass
      - LLM_PROVIDER=mock
      - DATABASE_URL=sqlite+aiosqlite:///./data/app.db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend/app:/app/app
      - backend-data:/app/data
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  backend-data:
